#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
  - fail2ban

users:
  - name: admin
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - #Dein SSH Pub Key

write_files:
  # .env
  - path: /opt/podcast-ai/.env
    content: |
      GOOGLE_APPLICATION_CREDENTIALS=/opt/podcast-ai/google-key.json
      GOOGLE_KEY_LOCAL_PATH=/opt/podcast-ai/google-key.json
      GEMINI_API_KEY= Dein API KEY
      MAILGUN_API_KEY=Dein API KEY
      MAILGUN_DOMAIN=podcast-ai.de
      DB_USER=podcast_user
      # Das $ Zeichen wird hier durch ein weiteres $ escaped (also $$), damit es erhalten bleibt
      DB_PASSWORD= Dein Password
      DB_NAME=podcast_db
      DB_HOST=db
      DB_PORT=3306
      tOm=placeholder_fix

  # SSH Hardening
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      Port 2222
      AllowUsers admin

  # Google Key
  - path: /opt/podcast-ai/google-key.json
    content: |
      {
        # Google JSON Credentials
      }

runcmd:
  - systemctl enable docker
  - systemctl start docker

  # Firewall Setup
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 2222/tcp
  - ufw allow 7860/tcp
  - ufw --force enable
  - systemctl restart ssh

  # Projekt Setup
  - mkdir -p /opt/podcast-ai/repo
  - git clone -b master https://github.com/dankvid/podcast-ai.git /opt/podcast-ai/repo
  
  # Dateien kopieren
  - cp /opt/podcast-ai/.env /opt/podcast-ai/repo/.env
  - cp /opt/podcast-ai/google-key.json /opt/podcast-ai/repo/google-key.json
  
  - chown -R admin:admin /opt/podcast-ai
  
  # Docker Start mit expliziter Pfadangabe zum Compose Plugin
  - cd /opt/podcast-ai/repo && docker compose up -d --build

final_message: "Podcast-AI wurde mit korrigierten Variablen installiert"
