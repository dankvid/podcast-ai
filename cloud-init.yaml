#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - git
  - ufw
  - fail2ban

users:
  - name: deployuser
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa DEIN_PUBLIC_SSH_KEY_HIER

write_files:
  # .env Datei vorbereiten
  - path: /opt/podcast-ai/.env
    content: |
      GOOGLE_APPLICATION_CREDENTIALS=/opt/podcast-ai/google-key.json
      # Hier weitere Variablen aus deiner .env.example ergänzen
      DATABASE_URL=sqlite:///./podcast.db

  # Google Cloud Key (Platzhalter - musst du mit deinem echten Inhalt ersetzen)
  - path: /opt/podcast-ai/google-key.json
    content: |
      {
        "type": "service_account",
        "project_id": "DEINE_PROJECT_ID"
      }

runcmd:
  # Docker Setup
  - systemctl enable docker
  - systemctl start docker

  # Firewall Setup
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 7860/tcp
  - ufw --force enable

  # Projekt klonen und starten
  - git clone -b master https://github.com/DEIN_USERNAME/DEIN_REPO.git /opt/podcast-ai/repo
  - cp /opt/podcast-ai/.env /opt/podcast-ai/repo/.env
  - cp /opt/podcast-ai/google-key.json /opt/podcast-ai/repo/google-key.json
  - cd /opt/podcast-ai/repo && docker-compose up -d --build

final_message: "Podcast-AI wurde installiert und wird im Hintergrund gestartet."
