#cloud-config
package_update: true
package_upgrade: true

# 1. Zusätzliche Sicherheitspakete installieren
packages:
  - docker.io
  - docker-compose
  - git
  - ufw
  - fail2ban

# 2. Einen dedizierten User anlegen (nicht root nutzen!)
users:
  - name: deployuser
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa DEIN_PUBLIC_SSH_KEY_HIER  # <-- HIER DEINEN PUBLIC KEY EINTRAGEN

# 3. SSH Hardening & Firewall Konfiguration
runcmd:
  # Docker Starten
  - systemctl enable docker
  - systemctl start docker
  
  # Firewall einstellen (UFW)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp      
  - ufw allow 7860/tcp    # Dein Podcast-Generator (Gradio)
  - ufw --force enable

  # SSH Hardening: Root Login und Passwort-Login verbieten
  - sed -i 's/^#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart ssh

  # Projektverzeichnis vorbereiten
  - mkdir -p /opt/podcast-ai
  - chown deployuser:deployuser /opt/podcast-ai

final_message: "System gehärtet und bereit. Login als 'deployuser' möglich."
