[project]
name = "podcast-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.5",
    "dnspython>=2.8.0",
    "ffmpeg-python>=0.2.0",
    "ffmpy>=1.0.0",
    "flask>=3.1.3",
    "google-cloud-aiplatform>=1.138.0",
    "google-cloud-texttospeech>=2.34.0",
    "google-genai>=1.64.0",
    "gradio==5.49.1",
    "lxml>=6.0.2",
    "nltk>=3.9.2",
    "numpy>=2.4.2",
    "paramiko==2.11.0",
    "passlib>=1.7.4",
    "pydub>=0.25.1",
    "pymysql>=1.1.2",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "selenium>=4.40.0",
    "sqlalchemy>=2.0.46",
    "sshtunnel>=0.4.0",
    "uvicorn>=0.41.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--ignore=tests/test_real_db.py"
filterwarnings = [
    "ignore::DeprecationWarning:pydub.utils",
    "ignore::RuntimeWarning:pydub.utils",
]
